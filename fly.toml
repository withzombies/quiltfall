# flyctl launch --copy-config --no-deploy --name YOUR-UNIQUE-APP-NAME
# adds your actual app name. Run one machine with one volume.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BIND_ADDR = "0.0.0.0:8080"
  DATABASE_URL = "sqlite:///data/quiltfall.db"
  COOKIE_SECURE = "true"
  RUST_LOG = "info"

[[mounts]]
  source = "quiltfall_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
