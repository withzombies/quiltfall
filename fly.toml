# One static LiteFS primary. Keep this volume across every deployment.
kill_signal = "SIGTERM"
kill_timeout = 15
app = "quiltfall"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BIND_ADDR = "0.0.0.0:8080"
  DATABASE_URL = "sqlite:///litefs/quiltfall.db"
  COOKIE_SECURE = "true"
  RUST_LOG = "info"
  PUBLIC_ORIGIN = "https://quiltfall.fly.dev"

[[mounts]]
  source = "quiltfall_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
